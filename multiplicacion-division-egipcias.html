// ---- utilidades de duplicación egipcia ----
function buildMultiplication(a, b) {
  // a: se duplica; b: se descompone en potencias de 2
  const rows = [];
  let left = 1, right = a;
  while (left <= b) {
    rows.push({ left, right });
    left *= 2; right *= 2;
  }
  // elegir filas (empezando por la mayor) cuya suma de "left" dé b
  let remaining = b;
  const marked = [];
  for (let i = rows.length - 1; i >= 0; i--) {
    if (rows[i].left <= remaining) {
      marked.push(rows[i]);
      remaining -= rows[i].left;
    }
  }
  marked.sort((x, y) => x.left - y.left);
  const total = marked.reduce((s, r) => s + r.right, 0);
  return { rows, marked, total };
}

function buildDivision(dividend, divisor) {
  // divisor: se duplica; dividend: se descompone usando la columna derecha
  const rows = [];
  let left = 1, right = divisor;
  while (right <= dividend) {
    rows.push({ left, right });
    left *= 2; right *= 2;
  }
  let remaining = dividend;
  const marked = [];
  for (let i = rows.length - 1; i >= 0; i--) {
    if (rows[i].right <= remaining) {
      marked.push(rows[i]);
      remaining -= rows[i].right;
    }
  }
  marked.sort((x, y) => x.left - y.left);
  const total = marked.reduce((s, r) => s + r.left, 0);
  return { rows, marked, total, remainder: remaining };
}

function renderTable(rows, marked, leftLabel, rightLabel) {
  const markedSet = new Set(marked.map(r => r.left));
  let html = '<table class="duplication"><thead><tr><th>' + leftLabel + '</th><th>' + rightLabel + '</th><th>' + tr('thUsed') + '</th></tr></thead><tbody>';
  for (const r of rows) {
    const isMarked = markedSet.has(r.left);
    html += '<tr' + (isMarked ? ' class="marked"' : '') + '><td>' + r.left + '</td><td>' + r.right + '</td><td>' + (isMarked ? '✔' : '—') + '</td></tr>';
  }
  html += '</tbody></table>';
  return html;
}

// ---- MULTIPLICACIÓN ----
let mulA, mulB, mulResult, mulData;
function newMul() {
  mulA = Math.floor(Math.random() * 13) + 3;   // 3..15
  mulB = Math.floor(Math.random() * 17) + 3;   // 3..19
  mulResult = mulA * mulB;
  mulData = buildMultiplication(mulA, mulB);
  document.getElementById('mulDisplay').textContent = mulA + ' × ' + mulB;
  document.getElementById('mulAnswer').value = '';
  document.getElementById('mulFeedback').textContent = '';
  document.getElementById('mulFeedback').className = 'feedback';
  document.getElementById('mulSteps').classList.add('hidden');
  document.getElementById('mulSteps').innerHTML = '';
}
function checkMul() {
  const val = Number(document.getElementById('mulAnswer').value);
  const fb = document.getElementById('mulFeedback');
  if (val === mulResult) {
    fb.textContent = tr('ok') + mulA + ' × ' + mulB + ' = ' + mulResult;
    fb.className = 'feedback ok';
  } else {
    fb.textContent = tr('bad');
    fb.className = 'feedback bad';
  }
}
function revealMul() {
  const area = document.getElementById('mulSteps');
  const sumLeft = mulData.marked.map(r => r.left).join(' + ');
  const sumRight = mulData.marked.map(r => r.right).join(' + ');
  area.innerHTML =
    renderTable(mulData.rows, mulData.marked, tr('thLeft'), tr('rightCol')(mulA)) +
    '<div class="result-line">' + mulB + ' = ' + sumLeft + ' &nbsp;→&nbsp; ' + tr('sumRightTxt') + ' ' + sumRight + ' = <b>' + mulData.total + '</b></div>' +
    '<div class="compare">' +
      '<div class="card"><b>' + tr('egMethod') + '</b>' + sumRight + ' = ' + mulData.total + '</div>' +
      '<div class="card"><b>' + tr('modern') + '</b>' + mulA + ' × ' + mulB + ' = ' + mulResult + '</div>' +
    '</div>';
  area.classList.remove('hidden');
}

// ---- DIVISIÓN ----
